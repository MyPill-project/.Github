name: Feature request
description: Suggest an improvement or a new feature
labels: [enhancement]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Mobile app
        - API or worker
        - Firmware / device
        - Infrastructure
        - Not sure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who is this for, and what can't they do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you'd like to happen. Alternatives you considered are welcome too.
